[workspace]
name = "luco"
channels = ["conda-forge"]
platforms = ["linux-64", "win-64", "osx-arm64"]

[dependencies]
python = ">=3.11,<3.14"
pyyaml = "*"
httpx = "*"
fastapi = "*"
uvicorn = "*"
pytest = "*"
pytest-asyncio = "*"
asyncpg = "*"
bcrypt = "*"
pyjwt = "*"
tiktoken = "*"
nodejs = ">=26.13.1,<26.14"

[pypi-dependencies]
llama-index-core = "*"
llama-index-llms-openai-like = "*"
openviking-sdk = "*"
pymupdf4llm = ">=2.1, <3"
mammoth = ">=1.13.0, <2"

[activation.env]
PYTHONPATH = "$PIXI_PROJECT_ROOT/src"

[tasks]
serve = "uvicorn luco.api:app --host 0.0.0.0 --port 8000 --reload"
chat = "python -m luco.cli"
web = "cd frontend && bun run build && bun run start"
"dev:frontend" = "cd frontend && bun run dev"
"build:frontend" = "cd frontend && bun run build"
ingest = "python scripts/ingest.py"
spike = "python scripts/spike.py"
build-lookup = "python scripts/build_lookup.py"
build-manifest = "python scripts/build_manifest.py"
check-links = "python scripts/check_links.py"
crawl = "python scripts/crawl_openalex.py"
eval = "python eval/run_eval.py"
"benchmark-modes" = "python scripts/benchmark_modes.py"
"benchmark-bert" = "docker exec -i luco-indobert python - < scripts/benchmark_embeddings.py"
"benchmark-context" = "python scripts/benchmark_context_stuffing_vs_luco.py"
test = "pytest -q tests"
monitor = "python scripts/monitor.py"
up = "docker compose up -d"
down = "docker compose down"
"up:deps" = "docker compose -f dependencies/docker-compose.yml up -d"
"up:viking" = "docker compose -f dependencies/docker-compose.yml up -d openviking"
"up:proxy" = "docker compose -f dependencies/docker-compose.yml up -d antigravity-proxy"
"up:postgres" = "docker compose -f dependencies/docker-compose.yml up -d postgres"
"down:deps" = "docker compose -f dependencies/docker-compose.yml down"
"build:image" = "docker compose build luco-app"
